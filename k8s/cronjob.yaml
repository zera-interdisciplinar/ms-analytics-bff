apiVersion: batch/v1
kind: CronJob
metadata:
  name: ms-analytics-bff
  namespace: production
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: ms-analytics-bff-cron
            image: southamerica-east1-docker.pkg.dev/zera-509513/repo/ms-analytics-bff:IMAGE_TAG
            imagePullPolicy: Always
            command: ["python", "-m", "app.cron.main"]
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "1"
            env:
            - name: APP_ENV
              value: "production"
