apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-analytics-bff
  namespace: production
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ms-analytics-bff
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ms-analytics-bff
    spec:
      containers:
      - name: ms-analytics-bff
        image: southamerica-east1-docker.pkg.dev/zera-509513/repo/ms-analytics-bff:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_PORT
          value: "8000"
        - name: APP_HOST
          value: "0.0.0.0"
        - name: JWT_ISSUER
          value: "ms-administrative-core"
