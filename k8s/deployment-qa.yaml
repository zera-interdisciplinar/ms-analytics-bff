apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-analytics-bff
  namespace: qa
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ms-analytics-bff
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ms-analytics-bff
    spec:
      containers:
      - name: ms-analytics-bff
        image: southamerica-east1-docker.pkg.dev/zera-512810/repo/ms-analytics-bff:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        env:
        - name: APP_ENV
          value: "QA"
        - name: APP_PORT
          value: "8000"
        - name: APP_HOST
          value: "0.0.0.0"
        - name: JWT_ISSUER
          value: "ms-administrative-core-qa"
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: ms-administrative-core-jwt
              key: public.pem
        - name: PG_HOST
          value: "postgres"
        - name: PG_PORT
          value: "5432"
        - name: PG_DATABASE
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_DB
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_USER
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_PASSWORD
        - name: NEO4J_URI
          value: "bolt://neo4j:7687"
        - name: NEO4J_USER
          valueFrom:
            secretKeyRef:
              name: neo4j-secrets
              key: NEO4J_USER
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neo4j-secrets
              key: NEO4J_PASSWORD
        - name: NEO4J_DATABASE
          valueFrom:
            secretKeyRef:
              name: neo4j-secrets
              key: NEO4J_DB
